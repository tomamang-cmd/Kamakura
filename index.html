<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>富士山橫濱16日</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse CSV Reader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    body { 
      font-family: 'Inter', 'Noto Sans TC', sans-serif; 
      background-color: #f8fafc; 
      color: #0f172a;
    }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Light Theme Card & Glass Nav */
    .light-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
    }

    .light-nav {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid #e2e8f0;
    }

    .fuji-light-gradient {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 50%, #4f46e5 100%);
    }

    /* 各分區頁籤預設淺色底色 */
    .tab-region-1 { background-color: #f0f9ff; color: #0369a1; border: 1px solid #bae6fd; }
    .tab-region-2 { background-color: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
    .tab-region-3 { background-color: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
    .tab-region-4 { background-color: #faf5ff; color: #7e22ce; border: 1px solid #e9d5ff; }

    /* 啟用狀態高亮 */
    .active-tab {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%) !important;
      color: #ffffff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    /* ===== 區域位置簡圖卡片 ===== */
    .region-map-card {
      background: rgba(255,255,255,.96);
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 28px -12px rgba(15,23,42,.18);
    }

    .region-map-preview,
    .region-map-canvas {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 24% 28%, rgba(255,255,255,.95) 0 6%, transparent 7%),
        linear-gradient(145deg, #e0f2fe 0%, #ecfdf5 52%, #fef3c7 100%);
    }

    .region-map-preview::before,
    .region-map-canvas::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: .34;
      background-image:
        linear-gradient(25deg, transparent 45%, rgba(148,163,184,.8) 46%, rgba(148,163,184,.8) 48%, transparent 49%),
        linear-gradient(-22deg, transparent 54%, rgba(148,163,184,.65) 55%, rgba(148,163,184,.65) 57%, transparent 58%);
      background-size: 120px 90px, 160px 110px;
    }

    .region-map-preview::after,
    .region-map-canvas::after {
      content: '';
      position: absolute;
      width: 48%;
      height: 30%;
      left: 17%;
      top: 42%;
      border-radius: 55% 45% 60% 40%;
      background: rgba(56,189,248,.55);
      box-shadow: 56px 22px 0 -10px rgba(56,189,248,.33);
      transform: rotate(-7deg);
    }

    .mini-pin,
    .map-pin {
      position: absolute;
      z-index: 5;
      transform: translate(-50%, -100%);
      border-radius: 9999px 9999px 9999px 0;
      transform-origin: 50% 100%;
      rotate: -45deg;
      box-shadow: 0 3px 8px rgba(15,23,42,.18);
    }

    .mini-pin {
      width: 14px;
      height: 14px;
      border: 2px solid white;
    }

    .map-pin {
      width: 24px;
      height: 24px;
      border: 3px solid white;
    }

    .mini-pin::after,
    .map-pin::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .map-label {
      position: absolute;
      z-index: 6;
      transform: translate(-50%, 0);
      white-space: nowrap;
      padding: 3px 7px;
      border-radius: 9999px;
      background: rgba(255,255,255,.90);
      border: 1px solid rgba(226,232,240,.95);
      color: #334155;
      font-size: 9px;
      font-weight: 800;
      box-shadow: 0 2px 8px rgba(15,23,42,.08);
      backdrop-filter: blur(6px);
    }

    .trip-progress-line {
      position: absolute;
      top: 17px;
      left: 12.5%;
      right: 12.5%;
      height: 2px;
      background-image: linear-gradient(to right, #7dd3fc 45%, transparent 45%);
      background-size: 9px 2px;
      background-repeat: repeat-x;
      opacity: .85;
    }

    .region-expand {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .32s ease, opacity .25s ease, margin-top .32s ease;
      opacity: 0;
      margin-top: 0;
    }

    .region-expand > div { overflow: hidden; }

    .region-expand.is-open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 14px;
    }

  </style>
</head>
<body class="min-h-screen pb-24 selection:bg-blue-500 selection:text-white">

  <!-- Sticky Top Header Section (Light Theme) -->
  <header class="sticky top-0 z-40 light-nav transition-all">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-2xl fuji-light-gradient flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-mountain text-base"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-base tracking-tight text-slate-900 flex items-center gap-1.5">
            富士山橫濱16日
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 border border-blue-200">2027</span>
          </h1>
          <p class="text-[11px] text-slate-500 font-medium">日本冬日雪景自由行</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="openEditItineraryModal()" class="px-3.5 py-1.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-xs rounded-xl shadow-md shadow-blue-500/20 active:scale-95 transition flex items-center space-x-1.5">
          <i class="fa-solid fa-pen-to-square"></i>
          <span>編輯</span>
        </button>

        <button onclick="openExpenseModal()" class="px-3.5 py-1.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold text-xs rounded-xl shadow-md shadow-emerald-500/20 active:scale-95 transition flex items-center space-x-1.5">
          <i class="fa-solid fa-wallet"></i>
          <span>記帳</span>
        </button>

        <button onclick="fetchSheetData()" title="重新整理" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl border border-slate-200 active:scale-90 transition">
          <i class="fa-solid fa-arrows-rotate text-xs"></i>
        </button>
      </div>
    </div>

    <!-- 天數橫向滾動頁籤 -->
    <div class="border-t border-slate-200/80 bg-slate-50/50">
      <div id="day-tabs" class="max-w-md mx-auto px-4 py-2.5 flex space-x-2 overflow-x-auto no-scrollbar scroll-smooth">
        <div class="text-xs text-slate-400 py-1">載入天數頁籤...</div>
      </div>
    </div>
  </header>

  <!-- 區域動態 Hero Banner -->
  <section class="max-w-md mx-auto px-4 mt-4">
    <div class="relative h-48 rounded-3xl overflow-hidden shadow-lg border border-slate-200 group">
      <img id="hero-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfe-vIAzy0eUvG6mfWL-CWwXHw7w6w-zEeMu2Idz7h1g&s=10" class="w-full h-full object-cover transition duration-700 group-hover:scale-105" alt="Region Banner">
      <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-950/20 to-transparent"></div>
      <div class="absolute bottom-4 left-4 right-4 flex items-end justify-between text-white">
        <div>
          <span id="hero-tag" class="inline-flex items-center gap-1 text-[10px] font-bold tracking-wider text-blue-200 bg-blue-900/60 backdrop-blur-md border border-blue-400/30 px-2.5 py-0.5 rounded-full mb-1">
            <i class="fa-solid fa-train-subway text-[9px]"></i> 藤澤・江之島・鎌倉區域
          </span>
          <h2 id="hero-title" class="text-lg font-black tracking-wide drop-shadow-md">湘南海岸 & 江之電風情</h2>
        </div>
        <div class="text-right">
          <div class="text-[10px] text-slate-300">來到了</div>
          <div id="hero-days" class="text-xs font-bold text-amber-300">D1 ~ D4</div>
        </div>
      </div>
    </div>
  </section>

  <!-- 今天在哪裡？區域位置簡圖 -->
  <section class="max-w-md mx-auto px-4 mt-4">
    <div class="region-map-card rounded-3xl p-4">
      <button type="button" onclick="toggleRegionMap()" class="w-full text-left active:scale-[0.995] transition" aria-controls="region-map-expanded" aria-expanded="false" id="region-map-toggle">
        <div class="flex gap-3 items-stretch">
          <div id="region-map-preview" class="region-map-preview relative w-[38%] min-h-[104px] rounded-2xl border border-slate-200 shrink-0">
            <div id="region-preview-badge" class="absolute left-2 top-2 z-10 text-[9px] font-black px-2 py-1 rounded-full bg-white/90 backdrop-blur border border-white/80 text-slate-700 shadow-sm">湘南</div>
            <div id="region-preview-svg" class="absolute inset-0"></div>
          </div>

          <div class="min-w-0 flex-1 py-0.5">
            <div class="flex items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-1.5 text-[11px] font-black text-emerald-600">
                  <i class="fa-solid fa-location-dot"></i>
                  <span>今天在哪裡？</span>
                </div>
                <div id="region-map-title" class="text-base font-black text-slate-900 mt-1 leading-tight">藤澤・江之島・鎌倉</div>
              </div>
              <span id="region-map-chevron" class="w-8 h-8 rounded-full bg-slate-50 border border-slate-200 flex items-center justify-center text-slate-500 shadow-sm shrink-0 transition-transform duration-300">
                <i class="fa-solid fa-chevron-down text-xs"></i>
              </span>
            </div>

            <div class="mt-2 flex items-center gap-2 flex-wrap">
              <span id="region-map-days" class="text-[10px] font-black px-2.5 py-1 rounded-full bg-sky-50 text-sky-700 border border-sky-200">D1 - D4</span>
              <span id="region-map-short" class="text-[10px] font-bold text-slate-400">湘南海岸</span>
            </div>

            <p id="region-map-description" class="text-[11px] text-slate-500 mt-2 leading-relaxed line-clamp-2">藤澤、江之島與鎌倉古都散策，沿著江之電欣賞湘南海岸。</p>
          </div>
        </div>
      </button>

      <!-- 16 日四區旅程軌跡 -->
      <div class="relative mt-4 pt-1">
        <div class="trip-progress-line"></div>
        <div id="trip-region-progress" class="relative z-10 grid grid-cols-4 gap-1"></div>
      </div>

      <!-- 點擊後展開的區域簡圖 -->
      <div id="region-map-expanded" class="region-expand">
        <div>
          <div class="pt-3 border-t border-slate-100">
            <div class="flex items-center justify-between mb-2.5">
              <div>
                <div class="text-[10px] tracking-[0.18em] font-black text-slate-400">AREA MAP</div>
                <div id="region-map-subtitle" class="text-xs font-extrabold text-slate-700 mt-0.5">景點相對位置簡圖</div>
              </div>
              <span class="text-[9px] text-slate-400 font-medium">示意位置・導航請點行程地點</span>
            </div>

            <div id="region-map-canvas" class="region-map-canvas h-56 rounded-2xl border border-slate-200">
              <div id="region-map-svg" class="absolute inset-0 z-10"></div>
              <div class="absolute right-3 top-3 z-20 flex flex-col items-center text-slate-500">
                <span class="text-[9px] font-black">N</span>
                <i class="fa-solid fa-location-arrow text-[11px] mt-0.5"></i>
              </div>
              <div id="region-map-landmark" class="absolute left-4 bottom-3 z-20 px-2.5 py-1.5 rounded-xl bg-white/90 backdrop-blur border border-white/80 shadow-sm text-[10px] font-black text-slate-700"></div>
            </div>

            <div id="region-map-stop-list" class="flex gap-2 overflow-x-auto no-scrollbar mt-3 pb-1"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 行程卡片明細區域 -->
  <main class="max-w-md mx-auto px-4 mt-5 relative">
    <div class="absolute left-8 top-3 bottom-3 w-0.5 bg-blue-500/30 z-0"></div>

    <div id="itinerary-list" class="space-y-6 relative z-10">
      <div class="text-center py-20 text-slate-400 flex flex-col items-center space-y-3">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500"></i>
        <p class="text-xs font-medium tracking-wider">正在連線讀取最新行程...</p>
      </div>
    </div>
  </main>

  <!-- 編輯/新增行程對話框 -->
  <div id="edit-itinerary-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden transition-opacity">
    <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-200 flex flex-col max-h-[88vh]">
      
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-xl bg-blue-100 border border-blue-200 flex items-center justify-center text-blue-600">
            <i class="fa-solid fa-calendar-plus text-sm"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm text-slate-900">新增/編輯行程</h3>
            <p class="text-[10px] text-slate-500">將新行程同步至雲端並自動排序</p>
          </div>
        </div>
        <button onclick="closeEditItineraryModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 no-scrollbar">
        <div class="grid grid-cols-2 gap-2.5 text-xs">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">天數 (Day)</label>
            <select id="edit-day" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-bold focus:outline-none focus:border-blue-500">
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">時間</label>
            <input type="text" id="edit-time" placeholder="例如：14:30" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-semibold focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2.5 text-xs">
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">行程名稱</label>
            <input type="text" id="edit-title" placeholder="例如：大石公園散策" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-semibold focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-700 mb-1">分類</label>
            <select id="edit-category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-bold focus:outline-none focus:border-blue-500">
              <option value="景點">📷 景點</option>
              <option value="美食">🍜 美食</option>
              <option value="採買">🛒 採買</option>
              <option value="交通">🚗 交通</option>
              <option value="住宿">🏨 住宿</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">地點名稱 (Location)</label>
          <input type="text" id="edit-location" placeholder="例如：大石公園" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-semibold focus:outline-none focus:border-blue-500 text-xs">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">Google Maps 網址 (選填)</label>
          <input type="text" id="edit-maps-url" placeholder="https://maps.app.goo.gl/..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-2 font-semibold focus:outline-none focus:border-blue-500 text-xs">
        </div>

        <div>
          <label class="block text-[11px] font-bold text-slate-700 mb-1">行程介紹 / 備註說明</label>
          <textarea id="edit-notes" rows="3" placeholder="請輸入行程詳細介紹與注意事項..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 font-normal focus:outline-none focus:border-blue-500 text-xs leading-relaxed"></textarea>
        </div>

        <button id="btn-save-itinerary" onclick="saveNewItineraryItem()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-md active:scale-[0.98]">
          確認新增並同步至雲端
        </button>
      </div>

      <div class="px-5 py-3 border-t border-slate-100 bg-slate-50/80 text-center">
        <button onclick="closeEditItineraryModal()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs py-2 rounded-xl transition">
          取消
        </button>
      </div>
    </div>
  </div>

  <!-- 記帳對話框 -->
  <div id="expense-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm hidden transition-opacity">
    <div class="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl border border-slate-200 flex flex-col max-h-[88vh]">
      
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/80">
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-xl bg-emerald-100 border border-emerald-200 flex items-center justify-center text-emerald-600">
            <i class="fa-solid fa-receipt text-sm"></i>
          </div>
          <div>
            <h3 class="font-bold text-sm text-slate-900">旅費記帳與累計支出</h3>
            <p class="text-[10px] text-slate-500">同步寫入雲端「記帳備忘錄」</p>
          </div>
        </div>
        <button onclick="closeExpenseModal()" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="p-5 overflow-y-auto space-y-5 no-scrollbar">
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-3">
          <div class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
            <i class="fa-solid fa-plus-circle text-emerald-500"></i>新增花費項目
          </div>

          <div class="grid grid-cols-2 gap-2.5 text-xs">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">日期</label>
              <input type="date" id="exp-date" value="2027-02-08" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 font-bold focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">分類</label>
              <select id="exp-category" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 font-bold focus:outline-none focus:border-emerald-500">
                <option value="超市">🛒 超市</option>
                <option value="餐廳">🍜 餐廳</option>
                <option value="車資">🚗 車資</option>
                <option value="玩樂">🎟️️ 玩樂</option>
                <option value="其他">📦 其他</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2.5 text-xs">
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">品名 / 明細</label>
              <input type="text" id="exp-name" placeholder="例如：刺身熟食" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 font-semibold focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <label class="block text-[11px] text-slate-500 mb-1">金額 (日幣 ¥)</label>
              <input type="number" id="exp-amount" placeholder="3200" class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 font-bold focus:outline-none focus:border-emerald-500">
            </div>
          </div>

          <button id="btn-save-expense" onclick="addExpenseRecord()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2 rounded-xl transition shadow-sm active:scale-[0.98]">

      { key: 'fuji', label: '富士五湖', days: 'D5 - D9', icon: 'fa-mountain', color: '#059669', soft: '#dcfce7' },
      { key: 'nagano', label: '長野地區', days: 'D10 - D12', icon: 'fa-tree', color: '#ea580c', soft: '#ffedd5' },
      { key: 'yokohama', label: '橫濱・品川', days: 'D13 - D16', icon: 'fa-city', color: '#9333ea', soft: '#f3e8ff' }
    ];

    let regionMapOpen = false;

    function getRegionKey(dayStr) {
      const dayNum = parseInt((dayStr || '').replace(/[^0-9]/g, '')) || 1;
      if (dayNum <= 4) return 'fujisawa';
      if (dayNum <= 9) return 'fuji';
      if (dayNum <= 12) return 'nagano';
      return 'yokohama';
    }

    function toggleRegionMap() {
      regionMapOpen = !regionMapOpen;
      const expanded = document.getElementById('region-map-expanded');
      const chevron = document.getElementById('region-map-chevron');
      const btn = document.getElementById('region-map-toggle');
      if (!expanded || !chevron || !btn) return;

      expanded.classList.toggle('is-open', regionMapOpen);
      chevron.style.transform = regionMapOpen ? 'rotate(180deg)' : 'rotate(0deg)';
      btn.setAttribute('aria-expanded', regionMapOpen ? 'true' : 'false');
    }

    function renderTripRegionProgress(activeKey) {
      const container = document.getElementById('trip-region-progress');
      if (!container) return;
      container.innerHTML = tripRegions.map(r => {
        const active = r.key === activeKey;
        return `
          <div class="text-center min-w-0">
            <div class="mx-auto w-9 h-9 rounded-full flex items-center justify-center border-2 border-white shadow-sm transition-all ${active ? 'scale-110 ring-2 ring-offset-2' : ''}"
                 style="background:${active ? r.color : r.soft}; color:${active ? '#fff' : r.color}; ${active ? `--tw-ring-color:${r.color};` : ''}">
              <i class="fa-solid ${r.icon} text-[11px]"></i>
            </div>
            <div class="mt-1.5 text-[9px] font-black truncate" style="color:${active ? r.color : '#64748b'}">${r.label}</div>
            <div class="text-[8px] font-bold text-slate-400">${r.days}</div>
          </div>`;
      }).join('');
    }

    function updateRegionMap(dayStr) {
      const key = getRegionKey(dayStr);
      const info = regionMapInfo[key];
      if (!info) return;

      const el = id => document.getElementById(id);
      if (el('region-preview-badge')) el('region-preview-badge').innerText = info.badge;
      if (el('region-map-title')) el('region-map-title').innerText = info.title;
      if (el('region-map-days')) {
        el('region-map-days').innerText = info.days;
        el('region-map-days').style.background = info.soft;
        el('region-map-days').style.color = info.accent;
        el('region-map-days').style.borderColor = info.accent + '33';
      }
      if (el('region-map-short')) {
        el('region-map-short').innerText = info.short;
        el('region-map-short').style.color = info.accent;
      }
      if (el('region-map-description')) el('region-map-description').innerText = info.description;
      if (el('region-map-landmark')) el('region-map-landmark').innerText = info.landmark;
      if (el('region-map-subtitle')) el('region-map-subtitle').innerText = `${info.title}・景點相對位置`;
      if (el('region-preview-svg')) el('region-preview-svg').innerHTML = info.previewSvg;
      if (el('region-map-svg')) el('region-map-svg').innerHTML = info.fullSvg;

      renderTripRegionProgress(key);

      const stopList = el('region-map-stop-list');
      if (stopList) {
        stopList.innerHTML = info.stops.map((stop) => `
          <span class="shrink-0 text-[10px] font-bold px-2.5 py-1.5 rounded-full border"
                style="background:${info.soft}; color:${info.accent}; border-color:${info.accent}33;">
            <i class="fa-solid fa-location-dot mr-1"></i>${stop}
          </span>
        `).join('');
      }
    }

    function getCategoryStyle(category) {
      switch(category) {
        case '住宿': return { bg: 'bg-indigo-50 text-indigo-600 border-indigo-200', icon: 'fa-hotel' };
        case '美食':
        case '餐廳': return { bg: 'bg-rose-50 text-rose-600 border-rose-200', icon: 'fa-utensils' };
        case '採買':
        case '超市':
        case '購物': return { bg: 'bg-emerald-50 text-emerald-600 border-emerald-200', icon: 'fa-cart-shopping' };
        case '交通':
        case '車資': return { bg: 'bg-sky-50 text-sky-600 border-sky-200', icon: 'fa-car' };
        case '玩樂': return { bg: 'bg-amber-50 text-amber-600 border-amber-200', icon: 'fa-ticket' };
        default: return { bg: 'bg-slate-100 text-slate-600 border-slate-200', icon: 'fa-camera' };
      }
    }

    function getRegionClass(dayStr) {
      const dayNum = parseInt(dayStr.replace(/[^0-9]/g, '')) || 1;
      if (dayNum >= 1 && dayNum <= 4) return 'tab-region-1';
      if (dayNum >= 5 && dayNum <= 9) return 'tab-region-2';
      if (dayNum >= 10 && dayNum <= 12) return 'tab-region-3';
      return 'tab-region-4';
    }

async function fetchSheetData() {
  const container = document.getElementById('itinerary-list');
  container.innerHTML = `
    <div class="text-center py-20 text-slate-400 flex flex-col items-center justify-center space-y-3">
      <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-500"></i>
      <p class="text-xs font-medium tracking-wider">正在連線讀取最新行程...</p>
    </div>`;

  try {
    // 💡 加上防快取機制，確保拿到最新的 Excel 變更
    const cacheBuster = new Date().getTime();
    const fetchUrl = CSV_URL.includes('?') 
      ? `${CSV_URL}&_cb=${cacheBuster}` 
      : `${CSV_URL}?_cb=${cacheBuster}`;

    const response = await fetch(fetchUrl);
    if (!response.ok) throw new Error('無法讀取 Google 試算表，請檢查網路連線');
    const csvText = await response.text();
    
    Papa.parse(csvText, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        allData = results.data.map(row => {
          const keys = Object.keys(row);
          // 去除 Day 字串前後多餘的空白
          const day = (row[keys[0]] || row['Day'] || '').toString().trim();
          const date = (row[keys[1]] || row['Date'] || '').toString().trim();
          
          if (day && date && !dayDateMap[day]) {
            dayDateMap[day] = date;
          }

          // 清理時間格式（去除引號與多餘秒數）
          let rawTime = (row[keys[2]] || row['Time'] || '').toString().trim();
          rawTime = rawTime.replace(/^'/, '');
          if (rawTime.includes(':')) {
            const timeParts = rawTime.split(':');
            rawTime = `${timeParts[0].padStart(2, '0')}:${timeParts[1]}`;
          }

          return {
            day: day,
            date: date,
            time: rawTime || '12:00',
            title: row[keys[3]] || row['Title'] || '無標題',
            category: row[keys[4]] || row['Category'] || '行程',
            location: row[keys[5]] || row['Location'] || '',
            maps_url: row[keys[6]] || row['Maps_URL'] || '',
            image1: row[keys[7]] || row['Image_URL_1'] || row['Image_URL'] || '',
            image2: row[keys[8]] || row['Image_URL_2'] || '',
            notes: row[keys[9]] || row['Notes'] || ''
          };
        }).filter(item => item.day && item.day !== '');

        if (allData.length === 0) {
          showError('未搜尋到有效的行程內容');
          return;
        }

        renderTabs();
      },
      error: function(err) { showError('CSV 格式解析錯誤：' + err.message); }
    });

  } catch (error) {
    console.error(error);
    showError(error.message);
  }
}
    function showError(msg) {
      document.getElementById('itinerary-list').innerHTML = `
        <div class="text-center py-10 text-rose-500 font-semibold light-card rounded-3xl p-6 border border-rose-200">
          <i class="fa-solid fa-triangle-exclamation text-3xl mb-3 text-rose-500"></i>
          <p class="text-sm text-slate-800">資料讀取中斷</p>
          <p class="text-xs text-rose-400 font-normal mt-1">${msg}</p>
          <button onclick="fetchSheetData()" class="mt-4 px-4 py-2 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow transition">
            重試連線
          </button>
        </div>`;
    }

    function updateHeroSection(dayStr) {
      const dayNum = parseInt(dayStr.replace(/[^0-9]/g, '')) || 1;
      let target = regionInfo.fujisawa;

      if (dayNum >= 1 && dayNum <= 4) target = regionInfo.fujisawa;
      else if (dayNum >= 5 && dayNum <= 9) target = regionInfo.fuji;
      else if (dayNum >= 10 && dayNum <= 12) target = regionInfo.nagano;
      else if (dayNum >= 13) target = regionInfo.yokohama;

      document.getElementById('hero-img').src = target.img;
      document.getElementById('hero-tag').innerHTML = target.tag;
      document.getElementById('hero-title').innerText = target.title;
      document.getElementById('hero-days').innerText = target.days;
      updateRegionMap(dayStr);
    }

 function renderTabs() {
  // 1. 取得所有不重複的 Day 列表
  let days = [...new Set(allData.map(item => item.day))].filter(Boolean);

  // 2. 💡 修正數字自然排序：將 "Day10" 提取出數字 10 進行正確的大到小/小到大數值排序
  days.sort((a, b) => {
    const numA = parseInt(a.replace(/[^0-9]/g, ''), 10) || 0;
    const numB = parseInt(b.replace(/[^0-9]/g, ''), 10) || 0;
    return numA - numB;
  });

  const tabsContainer = document.getElementById('day-tabs');
  tabsContainer.innerHTML = '';

  if (days.length === 0) return;
  if (!currentDay || !days.includes(currentDay)) {
    currentDay = days[0];
  }

  updateHeroSection(currentDay);

  days.forEach(day => {
    const itemData = allData.find(d => d.day === day);
    const dateStr = itemData && itemData.date ? itemData.date.substring(5) : '';
    const regionClass = getRegionClass(day);

    const btn = document.createElement('button');
    btn.className = `px-4 py-2 text-xs font-bold rounded-2xl whitespace-nowrap transition-all flex flex-col items-center shrink-0 ${regionClass} ${
      day === currentDay ? 'active-tab scale-105' : 'hover:opacity-80'
    }`;
    btn.innerHTML = `<span>${day}</span>${dateStr ? `<span class="text-[10px] opacity-80 font-medium">${dateStr}</span>` : ''}`;
    btn.onclick = () => {
      currentDay = day;
      updateHeroSection(day);
      renderTabs();
      renderItinerary();
    };
    tabsContainer.appendChild(btn);
  });

  renderItinerary();
}
    function renderItinerary() {
      const container = document.getElementById('itinerary-list');
      const filteredData = allData.filter(item => item.day === currentDay);

      if (filteredData.length === 0) {
        container.innerHTML = `<div class="text-center py-16 text-slate-400 text-xs">當天尚無行程細節安排</div>`;
        return;
      }

      container.innerHTML = filteredData.map((item) => {
        const catStyle = getCategoryStyle(item.category);
        return `
          <div class="relative pl-10">
            <div class="absolute left-2.5 top-5 w-3 h-3 rounded-full bg-blue-600 border-2 border-white shadow-md z-20"></div>
            <div class="light-card rounded-3xl overflow-hidden transition-all duration-300 hover:shadow-md p-4">
              ${item.image1 ? `
                <div class="grid ${item.image2 ? 'grid-cols-2' : 'grid-cols-1'} gap-1 bg-slate-100 overflow-hidden rounded-2xl mb-3">
                  <img src="${item.image1}" class="w-full h-36 object-cover" onerror="this.style.display='none'">
                  ${item.image2 ? `<img src="${item.image2}" class="w-full h-36 object-cover" onerror="this.style.display='none'">` : ''}
                </div>
              ` : ''}
              
              <div class="space-y-1">
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold text-blue-600 flex items-center gap-1">
                    <i class="fa-regular fa-clock text-[11px]"></i>${item.time || '整天'}
                  </span>
                  <span class="text-[10px] font-semibold px-2 py-0.5 rounded-lg border ${catStyle.bg} flex items-center gap-1">
                    <i class="fa-solid ${catStyle.icon} text-[9px]"></i>${item.category}
                  </span>
                </div>

                <h3 class="text-base font-extrabold text-slate-900 leading-tight">${item.title}</h3>
                
                ${item.location ? `
                  <p class="text-xs text-slate-500 flex items-center pt-0.5">
                    <i class="fa-solid fa-location-dot text-rose-500 mr-1 shrink-0"></i>
                    <a href="${item.maps_url || '#'}" target="_blank" class="hover:underline hover:text-blue-600 font-semibold truncate">${item.location}</a>
                  </p>
                ` : ''}

                ${item.notes ? `
                  <div class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100 mt-2 whitespace-pre-line leading-relaxed">
                    ${item.notes}
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* 編輯行程功能 */
    function openEditItineraryModal() {
      const daySelect = document.getElementById('edit-day');
      daySelect.innerHTML = '';
      
      const days = [...new Set(allData.map(item => item.day))].filter(Boolean);
      days.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.innerText = d;
        if (d === currentDay) opt.selected = true;
        daySelect.appendChild(opt);
      });

      document.getElementById('edit-itinerary-modal').classList.remove('hidden');
    }

    function closeEditItineraryModal() {
      document.getElementById('edit-itinerary-modal').classList.add('hidden');
    }

    async function saveNewItineraryItem() {
      const day = document.getElementById('edit-day').value;
      const time = document.getElementById('edit-time').value.trim();
      const title = document.getElementById('edit-title').value.trim();
      const category = document.getElementById('edit-category').value;
      const location = document.getElementById('edit-location').value.trim();
      const mapsUrl = document.getElementById('edit-maps-url').value.trim();
      const notes = document.getElementById('edit-notes').value.trim();

      if (!title) {
        alert('請輸入行程名稱！');
        return;
      }

      // 自動帶出該 Day 對應的真實日期 (例如 Day1 -> 2027-02-08)
      const mappedDate = dayDateMap[day] || '';

      const newItem = {
        action: 'addItinerary',
        day: day,
        date: mappedDate,
        time: time || '12:00',
        title: title,
        category: category,
        location: location,
        maps_url: mapsUrl || `https://maps.google.com/?q=${encodeURIComponent(location || title)}`,
        image1: '',
        image2: '',
        notes: notes
      };

      const btn = document.getElementById('btn-save-itinerary');
      btn.innerText = '正在寫入並自動排序...';
      btn.disabled = true;

      try {
        if (API_URL !== 'YOUR_GAS_WEB_APP_URL') {
          await fetch(API_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newItem)
          });
        }

        document.getElementById('edit-time').value = '';
        document.getElementById('edit-title').value = '';
        document.getElementById('edit-location').value = '';
        document.getElementById('edit-maps-url').value = '';
        document.getElementById('edit-notes').value = '';

        closeEditItineraryModal();
        
        // 重新讀取雲端最新資料（此時已經在 Excel 內自動整理排序完成）
        setTimeout(() => {
          fetchSheetData();
          alert('行程已寫入 Excel 並自動完成時間排序！');
        }, 1500);

      } catch (err) {
        alert('寫入失敗：' + err.message);
      } finally {
        btn.innerText = '確認新增並同步至雲端';
        btn.disabled = false;
      }
    }

    /* 記帳功能（向「記帳備忘錄」讀取與寫入） */
    async function openExpenseModal() {
      document.getElementById('expense-modal').classList.remove('hidden');
      await fetchExpenseLogs();
    }

    function closeExpenseModal() {
      document.getElementById('expense-modal').classList.add('hidden');
    }

    async function fetchExpenseLogs() {
      const logContainer = document.getElementById('expense-log-list');
      if (API_URL === 'YOUR_GAS_WEB_APP_URL') {
        renderExpenseLog();
        return;
      }

      try {
        const res = await fetch(API_URL);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            expenseRecords = data;
          }
        }
      } catch (err) {
        console.error('無法取得歷史記帳：', err);
      }
      renderExpenseLog();
    }

   async function addExpenseRecord() {
  const date = document.getElementById('exp-date').value;
  const category = document.getElementById('exp-category').value;
  const name = document.getElementById('exp-name').value.trim();
  const amountJpy = parseInt(document.getElementById('exp-amount').value) || 0;

  if (!name || amountJpy <= 0) {
    alert('請填寫完整名稱與正確的金額！');
    return;
  }

  // 傳遞 7 個欄位所需要的參數
  const record = { 
    action: 'addExpense', 
    date: date, 
    category: category, 
    name: name, 
    amountJpy: amountJpy,
    paymentMethod: '網頁記帳',
    notes: '來自網頁端輸入'
  };

  const btn = document.getElementById('btn-save-expense');
  btn.innerText = '寫入記帳備忘錄中...';
  btn.disabled = true;

  try {
    if (!API_URL.includes('YOUR_NEW')) {
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(record)
      });
    }

    expenseRecords.unshift({ date, category, name, amountJpy });
    document.getElementById('exp-name').value = '';
    document.getElementById('exp-amount').value = '';
    
    renderExpenseLog();
    alert('已成功新增至 Excel 的「記帳備忘錄」工作表！');
  } catch (err) {
    alert('記帳寫入失敗：' + err.message);
  } finally {
    btn.innerText = '同步寫入雲端試算表';
    btn.disabled = false;
  }
}
    function renderExpenseLog() {
      const rate = 0.22;
      const categories = ['超市', '餐廳', '車資', '玩樂', '其他'];
      const catTotals = { 超市: 0, 餐廳: 0, 車資: 0, 玩樂: 0, 其他: 0 };
      let grandTotalJpy = 0;

      expenseRecords.forEach(r => {
        catTotals[r.category] = (catTotals[r.category] || 0) + r.amountJpy;
        grandTotalJpy += r.amountJpy;
      });

      const summaryContainer = document.getElementById('expense-category-summary');
      summaryContainer.innerHTML = categories.map(cat => `
        <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 flex justify-between items-center">
          <span class="text-slate-600 font-semibold">${cat}</span>
          <span class="font-bold text-slate-900">¥${(catTotals[cat] || 0).toLocaleString()}</span>
        </div>
      `).join('');

      const grandNtd = Math.round(grandTotalJpy * rate);
      document.getElementById('grand-total-amount').innerText = `總計：NT$ ${grandNtd.toLocaleString()} (¥${grandTotalJpy.toLocaleString()})`;

      const logContainer = document.getElementById('expense-log-list');
      if (expenseRecords.length === 0) {
        logContainer.innerHTML = `<div class="text-center text-slate-400 py-4">尚無記帳紀錄</div>`;
        return;
      }

      logContainer.innerHTML = expenseRecords.map(r => `
        <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded-xl border border-slate-100">
          <div>
            <div class="font-bold text-slate-800">${r.name}</div>
            <div class="text-[10px] text-slate-400">${r.date} ・ ${r.category}</div>
          </div>
          <div class="text-right">
            <div class="font-black text-emerald-600">¥${r.amountJpy.toLocaleString()}</div>
            <div class="text-[10px] text-slate-400">NT$ ${Math.round(r.amountJpy * rate)}</div>
          </div>
        </div>
      `).join('');
    }

    window.addEventListener('DOMContentLoaded', () => {
      fetchSheetData();
    });
  </script>
